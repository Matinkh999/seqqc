[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seqqc"
version = "0.1.0"
description = "A small, extensible quality-control tool for DNA sequencing data (FASTQ/FASTA)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "matplotlib",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "biopython",   # only used to cross-check our results
]

[project.scripts]
seqqc = "seqqc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
